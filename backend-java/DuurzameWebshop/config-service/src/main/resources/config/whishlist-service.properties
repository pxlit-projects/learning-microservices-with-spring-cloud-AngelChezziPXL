
server.port=8084
debug=false
# Used only if nothing else specifies a profile
spring.profiles.default=dev

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/whishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UCT
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka server path
eureka.client.serviceUrl.defaultZone=http://localhost:8061/eureka/


# Ensure detailed exception messages are enabled
server.error.include-message=always